<article class="event-card" data-reveal="zoom" data-delay="{{ card_delay | default(0) }}">
  <div class="event-card__media">
    <img src="{{ event.image }}" alt="{{ event.name }} — {{ site.church_name }}" loading="lazy">
    <span class="event-card__date">
      <strong>{{ event.day }}</strong>
      <small>{{ event.month }}</small>
    </span>
  </div>
  <div class="event-card__body">
    <span class="chip chip--gold">{{ event.tag }}</span>
    <h3 class="event-card__name">{{ event.name }}</h3>
    <p class="event-card__desc">{{ event.description }}</p>
    <ul class="event-card__meta">
      <li><i class="fa-regular fa-clock" aria-hidden="true"></i> {{ event.time }}</li>
      <li><i class="fa-solid fa-location-dot" aria-hidden="true"></i> {{ event.place }}</li>
    </ul>
  </div>
</article>
